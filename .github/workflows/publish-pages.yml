name: 发布评估报告到 GitHub Pages

# 只要 main 上的报告站点内容（docs/）有变化，就自动同步到 gh-pages 分支，
# 因此日常只需要 git push origin main，不必再手动跑 git subtree push。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取完整历史（git subtree 需要）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步 docs/ 到 gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          git subtree push --prefix docs origin gh-pages
